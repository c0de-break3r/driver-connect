      - heading "What our users are saying." [level=1] [ref=f20e274]
      - generic [ref=f20e278]:
        - generic [ref=f20e279]:
          - generic [ref=f20e282]:
            - generic [ref=f20e289]:
              - paragraph [ref=f20e291]: Sebastian Speier
              - paragraph [ref=f20e293]: Shop
            - paragraph [ref=f20e295]: Mobbin is a great resource and it always comes in handy to see what the best practices or standards are for mobile patterns in our current landscape.
          - generic [ref=f20e298]:
            - paragraph [ref=f20e305]: Oykun Yilmaz
            - paragraph [ref=f20e307]: Designing feasible solutions based on real-world products is crucial for our design careers. Mobbin provides the best resources for this approach. I use it daily!
          - generic [ref=f20e310]:
            - generic [ref=f20e317]:
              - paragraph [ref=f20e319]: Josiah Gulden
              - paragraph [ref=f20e321]: Compound Labs
            - paragraph [ref=f20e323]: Mobbin is one of the best ways to stay on top of the latest patterns, modalities, and visual trends in mobile product design... it’s an essential resources for my team.
        - generic [ref=f20e324]:
          - generic [ref=f20e327]:
            - generic [ref=f20e334]:
              - paragraph [ref=f20e336]: Haerin Song
              - paragraph [ref=f20e338]: Visa
            - paragraph [ref=f20e340]: By using the Mobbin app, I save both my research time and space in my photo galleries filled with random screenshots. I love how easy it is to search for different patterns and copy and paste flows into Figma. It is a wonderful design tool you cannot live without!
          - generic [ref=f20e343]:
            - generic [ref=f20e350]:
              - paragraph [ref=f20e352]: Taha Hossain
              - paragraph [ref=f20e354]: Daybreak
            - paragraph [ref=f20e356]: We can’t imagine a product design process without Mobbin. The quality, clarity and precision it provides make it just as valuable as it is intuitive
          - generic [ref=f20e359]:
            - generic [ref=f20e366]:
              - paragraph [ref=f20e368]: John Bai
              - paragraph [ref=f20e370]: Plaid
            - paragraph [ref=f20e372]: All my homies love Mobbin. I mean that. I finally deleted that folder of 1,866 unorganized screenshots and haven’t looked back since. Shout out to Jiho and the team for doing God’s work.
        - generic [ref=f20e373]:
          - generic [ref=f20e376]:
            - generic [ref=f20e383]:
              - paragraph [ref=f20e385]: Marco Cornacchia
              - paragraph [ref=f20e387]: Figma
            - paragraph [ref=f20e389]: Mobbin is one of my favorite resources for product design and ui inspo. I love having access to a ton of "real world examples" to see how different apps and companies handle specific UI patterns and flows
          - generic [ref=f20e392]:
            - generic [ref=f20e399]:
              - paragraph [ref=f20e401]: Meng To
              - paragraph [ref=f20e403]: DesignCode
            - paragraph [ref=f20e405]: Mobbin is a game-changer for designers looking to step up their understanding of UX and UI design patterns. It’s so massive, meticulously organized, has deep user flows and even a figma plugin! It’s indispensable in the modern designer’s toolbox.
          - generic [ref=f20e408]:
            - generic [ref=f20e415]:
              - paragraph [ref=f20e417]: Axel Lindmarker
              - paragraph [ref=f20e419]: Light
            - paragraph [ref=f20e421]: Mobbin is one of my main tools for finding flows to gain UX and UI insights from. Going there saves me a lot of time from having to do it myself.
        - generic [ref=f20e422]:
          - generic [ref=f20e425]:
            - generic [ref=f20e432]:
              - paragraph [ref=f20e434]: Daryl Ginn
              - paragraph [ref=f20e436]: Endless
            - paragraph [ref=f20e438]: Mobbin has quickly become our favourite inspiration resource for designing mobile apps at endless.design, their advanced filtering is unmatched in the inspiration space.
          - generic [ref=f20e441]:
            - generic [ref=f20e448]:
              - paragraph [ref=f20e450]: Bobby Giangeruso
              - paragraph [ref=f20e452]: Heart Hands, Inc
            - paragraph [ref=f20e454]: Mobbin is one of those tabs I never close. It’s the largest up-to-date library of app screens.
          - generic [ref=f20e457]:
            - paragraph [ref=f20e464]: Rachel How
            - paragraph [ref=f20e466]: Mobbin is my go-to reference for app & web design. Apart from saving countless hours, it gives me insights on the design patterns, copywriting, and user flows of world-class products. A must-have for creative inspiration and efficiency!
