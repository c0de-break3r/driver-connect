      - heading "What our users are saying." [level=1] [ref=f25e274]
      - generic [ref=f25e278]:
        - generic [ref=f25e279]:
          - generic [ref=f25e282]:
            - generic [ref=f25e289]:
              - paragraph [ref=f25e291]: Sebastian Speier
              - paragraph [ref=f25e293]: Shop
            - paragraph [ref=f25e295]: Mobbin is a great resource and it always comes in handy to see what the best practices or standards are for mobile patterns in our current landscape.
          - generic [ref=f25e298]:
            - paragraph [ref=f25e305]: Oykun Yilmaz
            - paragraph [ref=f25e307]: Designing feasible solutions based on real-world products is crucial for our design careers. Mobbin provides the best resources for this approach. I use it daily!
          - generic [ref=f25e310]:
            - generic [ref=f25e317]:
              - paragraph [ref=f25e319]: Josiah Gulden
              - paragraph [ref=f25e321]: Compound Labs
            - paragraph [ref=f25e323]: Mobbin is one of the best ways to stay on top of the latest patterns, modalities, and visual trends in mobile product design... it’s an essential resources for my team.
        - generic [ref=f25e324]:
          - generic [ref=f25e327]:
            - generic [ref=f25e334]:
              - paragraph [ref=f25e336]: Haerin Song
              - paragraph [ref=f25e338]: Visa
            - paragraph [ref=f25e340]: By using the Mobbin app, I save both my research time and space in my photo galleries filled with random screenshots. I love how easy it is to search for different patterns and copy and paste flows into Figma. It is a wonderful design tool you cannot live without!
          - generic [ref=f25e343]:
            - generic [ref=f25e350]:
              - paragraph [ref=f25e352]: Taha Hossain
              - paragraph [ref=f25e354]: Daybreak
            - paragraph [ref=f25e356]: We can’t imagine a product design process without Mobbin. The quality, clarity and precision it provides make it just as valuable as it is intuitive
          - generic [ref=f25e359]:
            - generic [ref=f25e366]:
              - paragraph [ref=f25e368]: John Bai
              - paragraph [ref=f25e370]: Plaid
            - paragraph [ref=f25e372]: All my homies love Mobbin. I mean that. I finally deleted that folder of 1,866 unorganized screenshots and haven’t looked back since. Shout out to Jiho and the team for doing God’s work.
        - generic [ref=f25e373]:
          - generic [ref=f25e376]:
            - generic [ref=f25e383]:
              - paragraph [ref=f25e385]: Marco Cornacchia
              - paragraph [ref=f25e387]: Figma
            - paragraph [ref=f25e389]: Mobbin is one of my favorite resources for product design and ui inspo. I love having access to a ton of "real world examples" to see how different apps and companies handle specific UI patterns and flows
          - generic [ref=f25e392]:
            - generic [ref=f25e399]:
              - paragraph [ref=f25e401]: Meng To
              - paragraph [ref=f25e403]: DesignCode
            - paragraph [ref=f25e405]: Mobbin is a game-changer for designers looking to step up their understanding of UX and UI design patterns. It’s so massive, meticulously organized, has deep user flows and even a figma plugin! It’s indispensable in the modern designer’s toolbox.
          - generic [ref=f25e408]:
            - generic [ref=f25e415]:
              - paragraph [ref=f25e417]: Axel Lindmarker
              - paragraph [ref=f25e419]: Light
            - paragraph [ref=f25e421]: Mobbin is one of my main tools for finding flows to gain UX and UI insights from. Going there saves me a lot of time from having to do it myself.
        - generic [ref=f25e422]:
          - generic [ref=f25e425]:
            - generic [ref=f25e432]:
              - paragraph [ref=f25e434]: Daryl Ginn
              - paragraph [ref=f25e436]: Endless
            - paragraph [ref=f25e438]: Mobbin has quickly become our favourite inspiration resource for designing mobile apps at endless.design, their advanced filtering is unmatched in the inspiration space.
          - generic [ref=f25e441]:
            - generic [ref=f25e448]:
              - paragraph [ref=f25e450]: Bobby Giangeruso
              - paragraph [ref=f25e452]: Heart Hands, Inc
            - paragraph [ref=f25e454]: Mobbin is one of those tabs I never close. It’s the largest up-to-date library of app screens.
          - generic [ref=f25e457]:
            - paragraph [ref=f25e464]: Rachel How
            - paragraph [ref=f25e466]: Mobbin is my go-to reference for app & web design. Apart from saving countless hours, it gives me insights on the design patterns, copywriting, and user flows of world-class products. A must-have for creative inspiration and efficiency!
