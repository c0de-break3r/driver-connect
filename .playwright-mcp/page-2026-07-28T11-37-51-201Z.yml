              - paragraph [ref=f15e436]: Endless
            - paragraph [ref=f15e438]: Mobbin has quickly become our favourite inspiration resource for designing mobile apps at endless.design, their advanced filtering is unmatched in the inspiration space.
          - generic [ref=f15e441]:
            - generic [ref=f15e448]:
              - paragraph [ref=f15e450]: Bobby Giangeruso
              - paragraph [ref=f15e452]: Heart Hands, Inc
            - paragraph [ref=f15e454]: Mobbin is one of those tabs I never close. It’s the largest up-to-date library of app screens.
