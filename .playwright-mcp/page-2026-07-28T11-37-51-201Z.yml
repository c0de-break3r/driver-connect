      - generic [ref=f15e278]:
        - generic [ref=f15e279]:
          - generic [ref=f15e282]:
            - generic [ref=f15e289]:
              - paragraph [ref=f15e291]: Sebastian Speier
              - paragraph [ref=f15e293]: Shop
            - paragraph [ref=f15e295]: Mobbin is a great resource and it always comes in handy to see what the best practices or standards are for mobile patterns in our current landscape.
          - generic [ref=f15e298]:
            - paragraph [ref=f15e305]: Oykun Yilmaz
            - paragraph [ref=f15e307]: Designing feasible solutions based on real-world products is crucial for our design careers. Mobbin provides the best resources for this approach. I use it daily!
          - generic [ref=f15e310]:
            - generic [ref=f15e317]:
              - paragraph [ref=f15e319]: Josiah Gulden
              - paragraph [ref=f15e321]: Compound Labs
            - paragraph [ref=f15e323]: Mobbin is one of the best ways to stay on top of the latest patterns, modalities, and visual trends in mobile product design... it’s an essential resources for my team.
        - generic [ref=f15e324]:
          - generic [ref=f15e327]:
            - generic [ref=f15e334]:
              - paragraph [ref=f15e336]: Haerin Song
              - paragraph [ref=f15e338]: Visa
            - paragraph [ref=f15e340]: By using the Mobbin app, I save both my research time and space in my photo galleries filled with random screenshots. I love how easy it is to search for different patterns and copy and paste flows into Figma. It is a wonderful design tool you cannot live without!
          - generic [ref=f15e343]:
            - generic [ref=f15e350]:
              - paragraph [ref=f15e352]: Taha Hossain
              - paragraph [ref=f15e354]: Daybreak
            - paragraph [ref=f15e356]: We can’t imagine a product design process without Mobbin. The quality, clarity and precision it provides make it just as valuable as it is intuitive
          - generic [ref=f15e359]:
            - generic [ref=f15e366]:
              - paragraph [ref=f15e368]: John Bai
              - paragraph [ref=f15e370]: Plaid
            - paragraph [ref=f15e372]: All my homies love Mobbin. I mean that. I finally deleted that folder of 1,866 unorganized screenshots and haven’t looked back since. Shout out to Jiho and the team for doing God’s work.
        - generic [ref=f15e373]:
          - generic [ref=f15e376]:
            - generic [ref=f15e383]:
              - paragraph [ref=f15e385]: Marco Cornacchia
              - paragraph [ref=f15e387]: Figma
            - paragraph [ref=f15e389]: Mobbin is one of my favorite resources for product design and ui inspo. I love having access to a ton of "real world examples" to see how different apps and companies handle specific UI patterns and flows
          - generic [ref=f15e392]:
            - generic [ref=f15e399]:
              - paragraph [ref=f15e401]: Meng To
              - paragraph [ref=f15e403]: DesignCode
            - paragraph [ref=f15e405]: Mobbin is a game-changer for designers looking to step up their understanding of UX and UI design patterns. It’s so massive, meticulously organized, has deep user flows and even a figma plugin! It’s indispensable in the modern designer’s toolbox.
          - generic [ref=f15e408]:
            - generic [ref=f15e415]:
              - paragraph [ref=f15e417]: Axel Lindmarker
              - paragraph [ref=f15e419]: Light
            - paragraph [ref=f15e421]: Mobbin is one of my main tools for finding flows to gain UX and UI insights from. Going there saves me a lot of time from having to do it myself.
        - generic [ref=f15e422]:
          - generic [ref=f15e425]:
            - generic [ref=f15e432]:
